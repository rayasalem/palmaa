# Palma API — Nginx reverse proxy with TLS
# Install: sudo cp deploy/nginx/api.palma.ps.conf /etc/nginx/sites-available/api.palma.ps
#          sudo ln -sf /etc/nginx/sites-available/api.palma.ps /etc/nginx/sites-enabled/
# SSL: run certbot (see deploy/PRODUCTION-API-HTTPS.md) — paths below match Let's Encrypt defaults.
#
# Node.js must listen on 127.0.0.1:5000 (set HOST=127.0.0.1 PORT=5000 in systemd/pm2 env).

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.palma.ps;

    # Allow Certbot HTTP-01 (if using certbot --nginx it may inject location ^~ /.well-known/)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.palma.ps;

    ssl_certificate     /etc/letsencrypt/live/api.palma.ps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.palma.ps/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Optional after first certbot run: ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Large JSON (product uploads) — align with Express BODY_LIMIT_PRODUCTS_MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 75s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
    }
}
