# Palma Marketplace – Nginx reverse proxy (HTTPS-ready)
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled.
# Replace palma.ps and certificate paths for production.

upstream backend {
    server backend:5000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# HTTP – redirect to HTTPS (recommended for crawlers/Google health checks)
server {
    listen 80;
    server_name palma.ps www.palma.ps;
    return 301 https://$server_name$request_uri;
}

server {
    listen 80;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/palma.ps.crt;
    # ssl_certificate_key /etc/nginx/ssl/palma.ps.key;
    server_name localhost palma.ps www.palma.ps;

    client_max_body_size 15M;

    # API → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ready {
        proxy_pass http://backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA + static
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
