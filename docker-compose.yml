# Palma Marketplace – Full stack (dev/staging)
# Production may use Supabase + managed Redis; this compose includes local DB and Redis for parity.
#
# Health probes: liveness = GET /health (process up), readiness = GET /ready (DB + deps).
# Backend healthcheck uses /ready so the container is "healthy" only when ready to receive traffic.
# Nginx depends_on backend with condition: service_healthy – traffic is only routed to fully ready backend instances.
# See deploy/HEALTH_PROBES.md for full probe usage across Docker/Compose/K8s/Render.

version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost/api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: palma-frontend:latest
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: palma-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      PORT: 5000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:-cookie-secret}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-50}
    env_file: server/.env
    # Readiness: /ready checks DB (and optional deps). Use for routing; container marked healthy only when ready.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: local Postgres for dev (schema from supabase/setup.sql). Production uses Supabase.
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: palma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palma_dev}
      POSTGRES_DB: palma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palma -d palma"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
