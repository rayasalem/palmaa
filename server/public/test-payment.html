<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test payment callback – simulate success/failure</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 1rem; }
    input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; }
    .success { background: #0a0; color: #fff; border: none; }
    .fail { background: #c00; color: #fff; border: none; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Simulate payment callback</h1>
  <p>Enter an order ID and click to simulate success or failure.</p>
  <input type="text" id="orderId" placeholder="Order ID (from Supabase)" />
  <div>
    <button class="success" id="btnSuccess">Simulate success → paid</button>
    <button class="fail" id="btnFail">Simulate failure → failed</button>
  </div>
  <pre id="result">(response here)</pre>
  <script>
    var API_BASE = 'https://palmaa.onrender.com';
    console.log('API BASE:', API_BASE);
    if (API_BASE.indexOf('palma.ps') !== -1) {
      console.error('❌ WRONG API BASE URL');
    }
    function post(status) {
      var orderId = document.getElementById('orderId').value.trim();
      if (!orderId) {
        document.getElementById('result').textContent = 'Enter an Order ID.';
        return;
      }
      fetch(API_BASE + '/api/payment/callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: orderId, status: status })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        })
        .catch(function (e) {
          document.getElementById('result').textContent = 'Error: ' + e.message;
        });
    }
    document.getElementById('btnSuccess').onclick = function () { post('success'); };
    document.getElementById('btnFail').onclick = function () { post('failed'); };
  </script>
</body>
</html>
